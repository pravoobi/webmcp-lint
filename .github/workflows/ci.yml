name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - name: Install Chromium for the runtime suite
        run: pnpm --filter @pravoobi/webmcp-lint-runtime exec playwright install --with-deps chromium
      - run: pnpm test

  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Lint the example fixtures (expected to find issues)
        run: node packages/cli/dist/index.js static "examples/**/*.html" --format sarif --output webmcp-lint.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: webmcp-lint.sarif
          category: webmcp-lint-examples
